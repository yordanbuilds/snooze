name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch upstream contract changes without a push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: node --test "tests/**/*.test.mjs"
      - name: Script tests
        run: bash tests/scripts.test.sh

  # The manifest is checked by Omarchy's own validator rather than a local
  # copy of its rules, so a tightened schema upstream fails here first.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Fetch Omarchy
        run: git clone --depth 1 https://github.com/basecamp/omarchy.git omarchy
      - name: Validate manifest
        run: bash omarchy/bin/omarchy-plugin-validate plugin

  # Model runs inside Quickshell's QML engine, which parses less JavaScript
  # than Node — this job loads it in that engine, on the distro Omarchy runs.
  #
  # The job also runs the gate's qmllint half at full strength, which needs two
  # things a bare container does not have. Quickshell's QML modules come from
  # pacman (Arch ships them in `extra`); without them the gate skips the lint
  # outright, which is what it did here before. Omarchy's shell kit comes from
  # the clone below, handed over through OMARCHY_QMLLINT_SHELL — the seam
  # tests/qml-smoke.sh reads before falling back to a local install.
  #
  # With both in place CI checks exactly what a dev machine checks: every
  # qs.Ui / qs.Commons type and property name the widget writes is resolved
  # against the real kit, so a typo here or a rename upstream fails this job.
  # It does not check members reached through Style/Color — see the gate's own
  # comment for why those cannot be told apart from correct ones.
  qml-smoke:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and Quickshell
        run: pacman -Syu --noconfirm git qt6-declarative quickshell
      - name: Fetch the Omarchy shell kit
        run: git clone --depth 1 https://github.com/basecamp/omarchy.git /omarchy
      - name: QML engine smoke
        env:
          OMARCHY_QMLLINT_SHELL: /omarchy/shell
        run: |
          out="$(bash tests/qml-smoke.sh 2>&1)"; status=$?
          printf '%s\n' "$out"
          [ "$status" -eq 0 ] || exit 1
          # Both halves are installed on purpose, so a lint that quietly fell
          # back to the weak path is a broken job, not an absent dev machine.
          case "$out" in
            *"kit resolved"*) ;;
            *) echo "qmllint did not resolve the shell kit"; exit 1 ;;
          esac
